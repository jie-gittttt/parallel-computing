<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>显存带宽与算术强度可视化</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- 引入 Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .conveyor-belt {
            background: repeating-linear-gradient(
                90deg,
                #334155,
                #334155 10px,
                #1e293b 10px,
                #1e293b 20px
            );
            animation: scroll-belt 1s linear infinite;
        }
        @keyframes scroll-belt {
            from { background-position: 0 0; }
            to { background-position: 20px 0; }
        }
        .paused-belt { animation-play-state: paused; }
        
        .data-packet { transition: left 0.1s linear; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // SVG Icons
        const Icons = {
            Server: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>,
            Cpu: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><path d="M9 1V4"/><path d="M15 1V4"/><path d="M9 20V23"/><path d="M15 20V23"/><path d="M20 9H23"/><path d="M20 14H23"/><path d="M1 9H4"/><path d="M1 14H4"/></svg>,
            ArrowRight: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>,
            Play: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
            Pause: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>,
            TrendingUp: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
        };

        const BandwidthViz = () => {
            const [isPlaying, setIsPlaying] = useState(false);
            const [bandwidth, setBandwidth] = useState(2); // Packets per second (Road width/speed)
            const [computeOps, setComputeOps] = useState(1); // Ops per packet (Arithmetic Intensity)
            
            // Simulation State
            const [packets, setPackets] = useState([]); // { id, x, state: 'transit'|'processing'|'done', progress: 0 }
            const [coreState, setCoreState] = useState('IDLE'); // IDLE, BUSY
            const [processedCount, setProcessedCount] = useState(0);
            const [totalOpsDone, setTotalOpsDone] = useState(0);
            const reqRef = useRef();
            const lastTimeRef = useRef(0);
            const packetIdRef = useRef(0);
            const processingRef = useRef(null); // Current packet being processed

            // Constants
            const TRACK_LENGTH = 300; // px
            const PACKET_SPEED = 100; // px/sec (Constant transit speed)
            const COMPUTE_SPEED = 5; // Ops per second the core can handle (Core Frequency)

            // Reset
            const reset = () => {
                setPackets([]);
                setCoreState('IDLE');
                setProcessedCount(0);
                setTotalOpsDone(0);
                processingRef.current = null;
                packetIdRef.current = 0;
            };

            // Animation Loop
            const animate = (time) => {
                if (!lastTimeRef.current) lastTimeRef.current = time;
                const dt = (time - lastTimeRef.current) / 1000;
                lastTimeRef.current = time;

                if (isPlaying) {
                    setPackets(prev => {
                        let nextPackets = prev.map(p => ({ ...p }));
                        
                        // 1. Spawn Packets based on Bandwidth (Simulating Memory Controller fetching)
                        // Probability based on dt and bandwidth
                        if (Math.random() < bandwidth * dt && nextPackets.length < 10 && !nextPackets.some(p => p.x < 30)) {
                             nextPackets.push({ 
                                 id: packetIdRef.current++, 
                                 x: 0, 
                                 state: 'transit', 
                                 computeLeft: computeOps 
                             });
                        }

                        // 2. Move Packets
                        // If core is busy, packets pile up at the end (x=250)
                        const coreIsBusy = processingRef.current !== null;
                        
                        nextPackets.forEach((p, idx) => {
                            if (p.state === 'transit') {
                                // Check collision with packet ahead
                                const packetAhead = nextPackets[idx-1];
                                const limit = packetAhead ? packetAhead.x - 30 : TRACK_LENGTH - 40; // Queue up
                                
                                if (p.x < limit) {
                                    p.x += PACKET_SPEED * dt;
                                } else {
                                    // Reached Core
                                    if (!coreIsBusy && idx === 0) {
                                        p.state = 'processing';
                                        processingRef.current = p;
                                    }
                                }
                            }
                        });

                        // 3. Process Logic
                        if (processingRef.current) {
                            const p = processingRef.current;
                            // Simulate Compute: Reduce ops needed
                            p.computeLeft -= COMPUTE_SPEED * dt;
                            
                            // Visual State
                            setCoreState('BUSY');

                            if (p.computeLeft <= 0) {
                                // Done
                                processingRef.current = null;
                                setCoreState('IDLE');
                                setProcessedCount(c => c + 1);
                                setTotalOpsDone(c => c + computeOps);
                                // Remove from list
                                nextPackets = nextPackets.filter(pkt => pkt.id !== p.id);
                            }
                        } else {
                             setCoreState('IDLE');
                        }

                        return nextPackets;
                    });
                }
                
                reqRef.current = requestAnimationFrame(animate);
            };

            useEffect(() => {
                reqRef.current = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(reqRef.current);
            }, [isPlaying, bandwidth, computeOps]);

            // Metrics
            const arithmeticIntensity = computeOps; // Ops / 1 Packet (assuming 1 packet = 1 unit memory)
            const memoryBoundScore = Math.min(100, (bandwidth / COMPUTE_SPEED) * 100); 
            // If Bandwidth is huge and Compute is slow, we are Compute Bound.
            // If Bandwidth is small and Compute is fast, we are Memory Bound.
            
            // Simplified status logic for UI
            const isMemBound = (COMPUTE_SPEED / computeOps) > bandwidth; 
            // Core throughput = 5 ops/sec. Packet needs N ops. Core consumes 5/N packets/sec.
            // If Bandwidth < 5/N, Core waits -> Memory Bound.

            return (
                <div className="max-w-4xl mx-auto p-6">
                    {/* Header */}
                    <div className="text-center mb-8">
                        <h1 className="text-3xl font-bold text-blue-400 mb-2 flex items-center justify-center gap-3">
                            <Icons.TrendingUp /> 显存带宽 vs 计算强度
                        </h1>
                        <p className="text-gray-400 text-sm">
                            为什么“多做计算”反而能节省“显存带宽”？
                        </p>
                    </div>

                    {/* Main Simulation Area */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        
                        {/* 1. Global Memory (Warehouse) */}
                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col items-center justify-center relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-1 bg-blue-500"></div>
                            <Icons.Server />
                            <h3 className="font-bold text-blue-300 mt-2">Global Memory</h3>
                            <div className="text-xs text-slate-400">数据仓库 (DRAM)</div>
                            <div className="mt-4 text-2xl font-mono text-white">
                                {bandwidth} <span className="text-xs text-slate-500">GB/s (模拟)</span>
                            </div>
                            <div className="text-xs text-slate-500 mt-1">显存带宽</div>
                        </div>

                        {/* 2. The Bus (Conveyor Belt) */}
                        <div className="bg-slate-900 p-2 rounded-xl border border-slate-800 flex flex-col items-center justify-center relative">
                            {/* Belt Visual */}
                            <div className="w-full h-16 bg-slate-800 rounded mb-2 relative overflow-hidden flex items-center">
                                {/* The Moving Background */}
                                <div className={`absolute inset-0 conveyor-belt opacity-30 ${!isPlaying ? 'paused-belt' : ''}`}></div>
                                
                                {/* Packets */}
                                {packets.map(p => (
                                    <div 
                                        key={p.id}
                                        className="absolute w-6 h-6 bg-green-500 rounded border-2 border-green-300 shadow flex items-center justify-center text-[8px] font-bold text-black z-10 data-packet"
                                        style={{ left: `${p.x}px` }}
                                    >
                                        Data
                                    </div>
                                ))}

                                {/* Label */}
                                <div className="absolute bottom-1 right-2 text-[10px] text-slate-500 font-mono">PCIe / NVLink / Memory Bus</div>
                            </div>
                            
                            {/* Queue Warning */}
                            {packets.length > 5 && (
                                <div className="text-xs text-red-400 font-bold animate-pulse">
                                    注意：数据阻塞 (Compute Bound)
                                </div>
                            )}
                            {packets.length === 0 && isPlaying && coreState === 'IDLE' && (
                                <div className="text-xs text-yellow-400 font-bold animate-pulse">
                                    注意：核心饥饿 (Memory Bound)
                                </div>
                            )}
                        </div>

                        {/* 3. Compute Core (Factory) */}
                        <div className={`p-4 rounded-xl border flex flex-col items-center justify-center transition-all duration-300 ${coreState === 'BUSY' ? 'bg-green-900/30 border-green-500 shadow-[0_0_20px_rgba(34,197,94,0.3)]' : 'bg-slate-800 border-slate-700'}`}>
                            <div className={`transition-transform duration-100 ${coreState === 'BUSY' ? 'scale-110 text-green-400' : 'text-slate-500'}`}>
                                <Icons.Cpu />
                            </div>
                            <h3 className="font-bold mt-2 transition-colors duration-300 ${coreState === 'BUSY' ? 'text-green-300' : 'text-slate-300'}">CUDA Core</h3>
                            <div className="text-xs text-slate-400">计算单元 (ALU)</div>
                            
                            {/* Processing Bar */}
                            <div className="w-full h-2 bg-slate-700 rounded-full mt-4 overflow-hidden">
                                {processingRef.current && (
                                    <div 
                                        className="h-full bg-green-500 transition-all duration-75"
                                        style={{ width: `${(1 - processingRef.current.computeLeft / computeOps) * 100}%` }}
                                    ></div>
                                )}
                            </div>
                            <div className="text-xs text-slate-500 mt-1">
                                {coreState === 'BUSY' ? 'Computing...' : 'Waiting for Data'}
                            </div>
                        </div>

                    </div>

                    {/* Controls & Metrics */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 bg-slate-800/50 p-6 rounded-2xl border border-slate-700">
                        
                        {/* Controls */}
                        <div className="space-y-6">
                            <div className="flex items-center gap-4 mb-4">
                                <button 
                                    onClick={() => { setIsPlaying(!isPlaying); if(!isPlaying && packets.length===0 && processedCount===0) reset(); }}
                                    className={`flex items-center gap-2 px-6 py-2 rounded-lg font-bold transition-all ${isPlaying ? 'bg-yellow-600 hover:bg-yellow-500' : 'bg-blue-600 hover:bg-blue-500'}`}
                                >
                                    {isPlaying ? <><Icons.Pause /> 暂停</> : <><Icons.Play /> 开始模拟</>}
                                </button>
                                <button onClick={reset} className="text-sm text-slate-400 hover:text-white underline">重置</button>
                            </div>

                            <div>
                                <label className="flex justify-between text-sm font-bold text-slate-300 mb-2">
                                    <span>带宽供给 (Memory Bandwidth)</span>
                                    <span className="text-blue-400">{bandwidth} Packets/s</span>
                                </label>
                                <input 
                                    type="range" min="1" max="10" step="1" 
                                    value={bandwidth} onChange={(e) => setBandwidth(Number(e.target.value))}
                                    className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500"
                                />
                                <p className="text-[10px] text-slate-500 mt-1">增加带宽可以缓解“核心饥饿”，但硬件带宽是很昂贵的。</p>
                            </div>

                            <div>
                                <label className="flex justify-between text-sm font-bold text-slate-300 mb-2">
                                    <span>算术强度 (Arithmetic Intensity)</span>
                                    <span className="text-green-400">{computeOps} Ops / Byte</span>
                                </label>
                                <input 
                                    type="range" min="1" max="20" step="1" 
                                    value={computeOps} onChange={(e) => setComputeOps(Number(e.target.value))}
                                    className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-green-500"
                                />
                                <p className="text-[10px] text-slate-500 mt-1">每个数据被读取后，在核心内做多少次运算。值越高，越容易喂饱核心。</p>
                            </div>
                        </div>

                        {/* Analysis & Code Mapping */}
                        <div className="bg-black/30 p-4 rounded-xl border border-slate-700 flex flex-col justify-between">
                            
                            {/* Status Indicator */}
                            <div className="mb-4">
                                <h4 className="text-sm font-bold text-slate-300 mb-2">当前瓶颈分析：</h4>
                                {packets.length === 0 && isPlaying ? (
                                    <div className="bg-red-900/30 border border-red-500 text-red-200 px-3 py-2 rounded text-sm flex items-center gap-2">
                                        <div className="w-2 h-2 bg-red-500 rounded-full animate-ping"></div>
                                        Memory Bound (受限于显存)
                                        <span className="text-[10px] ml-auto opacity-70">核心在空转</span>
                                    </div>
                                ) : packets.length > 2 ? (
                                    <div className="bg-green-900/30 border border-green-500 text-green-200 px-3 py-2 rounded text-sm flex items-center gap-2">
                                        <div className="w-2 h-2 bg-green-500 rounded-full"></div>
                                        Compute Bound (受限于算力)
                                        <span className="text-[10px] ml-auto opacity-70">带宽已喂饱</span>
                                    </div>
                                ) : (
                                    <div className="bg-yellow-900/30 border border-yellow-500 text-yellow-200 px-3 py-2 rounded text-sm">
                                        Balanced (平衡状态)
                                    </div>
                                )}
                            </div>

                            {/* Code Mapping */}
                            <div className="flex-1 overflow-auto">
                                <h4 className="text-sm font-bold text-slate-300 mb-2">代码映射：如何增加算术强度？</h4>
                                {computeOps < 5 ? (
                                    // Low Intensity Code
                                    <div className="font-mono text-[10px] text-red-300 bg-red-950/30 p-2 rounded border border-red-900/50">
                                        <div className="opacity-50">// Low Intensity (1 Op / Read)</div>
                                        <div>float val = <span className="text-blue-300">input[i]</span>; <span className="text-slate-500">// Read Global (Costly)</span></div>
                                        <div>val = val + 1.0f;     <span className="text-slate-500">// 1 Op</span></div>
                                        <div>output[i] = val;      <span className="text-slate-500">// Write Global</span></div>
                                        <div className="mt-2 text-white font-bold">带宽压力大，算力浪费。</div>
                                    </div>
                                ) : (
                                    // High Intensity Code
                                    <div className="font-mono text-[10px] text-green-300 bg-green-950/30 p-2 rounded border border-green-900/50">
                                        <div className="opacity-50">// High Intensity (Kernel Fusion)</div>
                                        <div>float val = <span className="text-blue-300">input[i]</span>; <span className="text-slate-500">// Read Global (Once)</span></div>
                                        <div><span className="text-yellow-300">#pragma unroll</span></div>
                                        <div>for(int k=0; k&lt;{computeOps}; k++) {'{'}</div>
                                        <div>  val = val * coeff[k] + bias; <span className="text-slate-500">// Many Ops in Reg</span></div>
                                        <div>{'}'}</div>
                                        <div>output[i] = val;</div>
                                        <div className="mt-2 text-white font-bold">一次读取，多次计算。免费提升性能。</div>
                                    </div>
                                )}
                            </div>
                        </div>

                    </div>
                    
                    <div className="text-center text-[10px] text-slate-600">
                        Total Ops: {totalOpsDone} | Throughput: {(processedCount / (performance.now()/1000)).toFixed(1)} Pkts/s
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BandwidthViz />);
    </script>
</body>
</html>
