<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUDA 卷积池化流程可视化</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
        }
        
        /* 轨道样式 */
        .track {
            position: relative;
            height: 4px;
            width: 100%;
            background: #e2e8f0;
            border-radius: 2px;
            margin-top: 2rem;
            margin-bottom: 2rem;
        }

        /* 节点样式 */
        .node {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #fff;
            border: 3px solid #cbd5e1;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .node.active-cpu {
            background-color: #3b82f6;
            border-color: #1d4ed8;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            transform: translate(-50%, -50%) scale(1.3);
        }

        .node.active-gpu {
            background-color: #22c55e;
            border-color: #15803d;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
            transform: translate(-50%, -50%) scale(1.3);
        }

        .node-label {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .gpu-track .node-label {
            top: auto;
            bottom: -30px;
        }

        .node.active-cpu .node-label { color: #1d4ed8; }
        .node.active-gpu .node-label { color: #15803d; }

        /* 数据包动画 */
        .packet {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #f59e0b;
            border-radius: 50%;
            z-index: 20;
            display: none;
            box-shadow: 0 0 10px #f59e0b;
        }

        /* 垂直连接线 */
        .connector {
            position: absolute;
            width: 2px;
            background-color: #cbd5e1;
            z-index: 5;
            transition: background-color 0.3s;
        }
        
        .connector.active {
            background-color: #f59e0b;
        }

        .log-entry {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="p-4 md:p-8 h-screen flex flex-col">

    <!-- 标题区 -->
    <div class="text-center mb-8">
        <h1 class="text-2xl md:text-3xl font-bold text-slate-800">CUDA 异构计算流程可视化</h1>
        <p class="text-slate-500 text-sm mt-2">基于《Cuda报告》: Host与Device的协同工作流</p>
    </div>

    <!-- 可视化主区域 -->
    <div class="flex-grow flex flex-col justify-center max-w-6xl mx-auto w-full relative bg-white rounded-xl shadow-lg p-6 md:p-12 overflow-hidden">
        
        <!-- CPU 通道 -->
        <div class="relative mb-16">
            <div class="flex items-center mb-2">
                <i data-lucide="cpu" class="w-6 h-6 text-blue-600 mr-2"></i>
                <span class="font-bold text-blue-800">Host (CPU)</span>
            </div>
            <div class="track bg-blue-50" id="cpu-track">
                <!-- 节点将通过JS动态生成 -->
            </div>
        </div>

        <!-- 连接层 (垂直线条) -->
        <div id="connector-layer" class="absolute inset-0 pointer-events-none"></div>
        
        <!-- 移动的数据包 -->
        <div id="packet" class="packet"></div>

        <!-- GPU 通道 -->
        <div class="relative mt-4">
            <div class="flex items-center mb-2">
                <i data-lucide="monitor-play" class="w-6 h-6 text-green-600 mr-2"></i>
                <span class="font-bold text-green-800">Device (GPU)</span>
            </div>
            <div class="track bg-green-50 gpu-track" id="gpu-track">
                <!-- 节点将通过JS动态生成 -->
            </div>
        </div>

    </div>

    <!-- 控制与日志区 -->
    <div class="mt-8 max-w-6xl mx-auto w-full grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- 控制面板 -->
        <div class="bg-white p-6 rounded-xl shadow-md flex flex-col justify-center items-center md:items-start col-span-1">
            <h3 class="font-bold text-slate-700 mb-4">控制面板</h3>
            <div class="flex space-x-4">
                <button onclick="startAnimation()" id="startBtn" class="flex items-center bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                    <i data-lucide="play" class="w-4 h-4 mr-2"></i> 开始运行
                </button>
                <button onclick="resetAnimation()" id="resetBtn" class="flex items-center bg-slate-200 hover:bg-slate-300 text-slate-700 px-6 py-2 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <i data-lucide="rotate-ccw" class="w-4 h-4 mr-2"></i> 重置
                </button>
            </div>
            <div class="mt-6 text-sm text-slate-500">
                <div class="flex items-center mb-2"><span class="w-3 h-3 bg-blue-500 rounded-full mr-2"></span> CPU (逻辑控制)</div>
                <div class="flex items-center mb-2"><span class="w-3 h-3 bg-green-500 rounded-full mr-2"></span> GPU (并行计算)</div>
                <div class="flex items-center"><span class="w-3 h-3 bg-amber-500 rounded-full mr-2 shadow-[0_0_5px_rgba(245,158,11,0.8)]"></span> 数据传输/控制信号</div>
            </div>
        </div>

        <!-- 运行日志 -->
        <div class="bg-slate-900 p-6 rounded-xl shadow-md col-span-2 text-slate-300 font-mono text-sm overflow-y-auto h-48 relative">
            <div class="absolute top-4 right-4 text-xs text-slate-500">系统日志</div>
            <div id="log-container" class="space-y-2">
                <div class="text-slate-500 italic">> 等待指令...</div>
            </div>
        </div>
    </div>

    <script>
        // 初始化图标
        lucide.createIcons();

        // 流程数据定义
        // pos: 0-100 (百分比位置)
        const steps = [
            { id: 'c1', type: 'cpu', pos: 5, label: '程序开始', action: 'start' },
            { id: 'c2', type: 'cpu', pos: 12, label: '读取图片', log: 'Host读取timg.bmp到内存' },
            { id: 'c3', type: 'cpu', pos: 19, label: 'cudaMalloc分配', linkTo: 'g1', log: '调用cudaMalloc请求显存' },
            { id: 'g1', type: 'gpu', pos: 19, label: '显存分配', log: 'Device分配全局内存空间' },
            
            { id: 'c4', type: 'cpu', pos: 28, label: 'H2D拷贝', linkTo: 'g2', log: 'cudaMemcpy: 将像素数据从Host传输到Device' },
            { id: 'g2', type: 'gpu', pos: 28, label: '存储数据', log: '数据写入Global Memory' },
            
            { id: 'c5', type: 'cpu', pos: 37, label: '启动Kernel', linkTo: 'g3', log: '配置Grid/Block，异步启动核函数' },
            
            // 并行计算阶段
            { id: 'g3', type: 'gpu', pos: 45, label: '卷积计算', log: 'Kernel1: 执行高斯卷积 (SIMT线程映射)' },
            { id: 'g4', type: 'gpu', pos: 55, label: '算子融合', log: '寄存器缓存中间结果，避免Global Memory读写' },
            { id: 'g5', type: 'gpu', pos: 65, label: '池化计算', log: 'Kernel2: 执行2x2最大池化' },
            
            // CPU在此期间等待（逻辑上的等待）
            { id: 'c6', type: 'cpu', pos: 65, label: '等待同步', log: 'CPU等待GPU计算完成...' },

            { id: 'c7', type: 'cpu', pos: 75, label: 'D2H拷贝', linkTo: 'g6', log: 'cudaMemcpy: 请求结果数据' },
            { id: 'g6', type: 'gpu', pos: 75, label: '读取结果', log: '从Global Memory读取处理后的图像' },
            
            { id: 'c8', type: 'cpu', pos: 85, label: '保存图片', log: 'Host将结果写入新文件' },
            { id: 'c9', type: 'cpu', pos: 92, label: '释放资源', linkTo: 'g7', log: 'cudaFree: 释放所有显存' },
            { id: 'g7', type: 'gpu', pos: 92, label: '显存释放', log: 'Device清理资源' },
            
            { id: 'c10', type: 'cpu', pos: 100, label: '程序结束', action: 'end', log: '程序执行完毕' }
        ];

        // 状态变量
        let currentStepIndex = 0;
        let isRunning = false;
        let timer = null;

        // 初始化DOM
        function init() {
            const cpuTrack = document.getElementById('cpu-track');
            const gpuTrack = document.getElementById('gpu-track');
            const connectorLayer = document.getElementById('connector-layer');

            // 渲染节点
            steps.forEach(step => {
                const node = document.createElement('div');
                node.id = `node-${step.id}`;
                node.className = `node ${step.type === 'cpu' ? 'border-blue-300' : 'border-green-300'}`;
                node.style.left = `${step.pos}%`;
                
                const label = document.createElement('div');
                label.className = 'node-label';
                label.innerText = step.label;
                node.appendChild(label);

                if (step.type === 'cpu') {
                    cpuTrack.appendChild(node);
                } else {
                    gpuTrack.appendChild(node);
                }
            });

            // 渲染连接线 (虽然CSS定位比较难精确，这里用JS计算)
            setTimeout(drawConnectors, 100); // 延时确保DOM布局完成
            window.addEventListener('resize', drawConnectors);
        }

        function drawConnectors() {
            const layer = document.getElementById('connector-layer');
            layer.innerHTML = '';
            
            steps.forEach(step => {
                if (step.linkTo) {
                    const startNode = document.getElementById(`node-${step.id}`);
                    const endNode = document.getElementById(`node-${step.linkTo}`);
                    
                    if (startNode && endNode) {
                        const startRect = startNode.getBoundingClientRect();
                        const endRect = endNode.getBoundingClientRect();
                        const containerRect = layer.getBoundingClientRect();

                        const line = document.createElement('div');
                        line.id = `line-${step.id}-${step.linkTo}`;
                        line.className = 'connector';
                        line.style.left = `${startRect.left + startRect.width/2 - containerRect.left - 1}px`;
                        line.style.top = `${startRect.top + startRect.height/2 - containerRect.top}px`;
                        line.style.height = `${endRect.top - startRect.top}px`;
                        
                        layer.appendChild(line);
                    }
                }
            });
        }

        // 动画核心逻辑
        async function startAnimation() {
            if (isRunning) return;
            isRunning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('resetBtn').disabled = false;
            document.getElementById('log-container').innerHTML = ''; // 清空日志

            addLog('系统', '开始执行...');

            for (let i = 0; i < steps.length; i++) {
                if (!isRunning) break;
                await processStep(steps[i], i);
            }
            
            isRunning = false;
        }

        async function processStep(step, index) {
            // 1. 激活当前节点
            const node = document.getElementById(`node-${step.id}`);
            const activeClass = step.type === 'cpu' ? 'active-cpu' : 'active-gpu';
            node.classList.add(activeClass);

            // 2. 记录日志
            if (step.log) {
                addLog(step.type === 'cpu' ? 'HOST' : 'DEVICE', step.log);
            }

            // 3. 处理数据传输动画
            if (step.linkTo) {
                const targetStep = steps.find(s => s.id === step.linkTo);
                const targetNode = document.getElementById(`node-${targetStep.id}`);
                const line = document.getElementById(`line-${step.id}-${step.linkTo}`);
                
                // 激活连线
                if (line) line.classList.add('active');
                
                // 数据包移动
                await movePacket(node, targetNode);
                
                // 激活目标节点
                if (targetNode) {
                    const targetActiveClass = targetStep.type === 'cpu' ? 'active-cpu' : 'active-gpu';
                    targetNode.classList.add(targetActiveClass);
                    // 如果目标有日志，也显示（通常link的目标是配对的被动操作）
                    if (targetStep.log) addLog(targetStep.type === 'cpu' ? 'HOST' : 'DEVICE', targetStep.log);
                }
            } else {
                // 如果没有垂直连接，且不是最后一个，模拟水平移动时间
                if (index < steps.length - 1) {
                    await new Promise(r => setTimeout(r, 800));
                }
            }
        }

        function movePacket(fromNode, toNode) {
            return new Promise(resolve => {
                const packet = document.getElementById('packet');
                const fromRect = fromNode.getBoundingClientRect();
                const toRect = toNode.getBoundingClientRect();
                const containerRect = document.body.getBoundingClientRect(); // 基于body定位

                // 初始位置
                packet.style.display = 'block';
                // 修正坐标计算
                const startX = fromRect.left + fromRect.width/2 + window.scrollX;
                const startY = fromRect.top + fromRect.height/2 + window.scrollY;
                const endX = toRect.left + toRect.width/2 + window.scrollX;
                const endY = toRect.top + toRect.height/2 + window.scrollY;

                packet.style.left = `${startX - 6}px`; // -6 是宽度一半
                packet.style.top = `${startY - 6}px`;
                packet.style.transition = 'none';

                // 强制重绘
                packet.offsetHeight;

                // 移动
                packet.style.transition = 'all 1s ease-in-out';
                packet.style.left = `${endX - 6}px`;
                packet.style.top = `${endY - 6}px`;

                setTimeout(() => {
                    packet.style.display = 'none';
                    resolve();
                }, 1000);
            });
        }

        function addLog(source, message) {
            const container = document.getElementById('log-container');
            const entry = document.createElement('div');
            entry.className = 'log-entry mb-2 border-l-2 pl-2 ' + 
                (source === 'HOST' ? 'border-blue-500 text-blue-200' : 
                 source === 'DEVICE' ? 'border-green-500 text-green-200' : 'border-gray-500');
            
            entry.innerHTML = `<span class="text-xs font-bold opacity-70">[${source}]</span> ${message}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        function resetAnimation() {
            isRunning = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('resetBtn').disabled = true;
            
            // 重置样式
            document.querySelectorAll('.node').forEach(n => {
                n.classList.remove('active-cpu', 'active-gpu');
            });
            document.querySelectorAll('.connector').forEach(c => {
                c.classList.remove('active');
            });
            document.getElementById('packet').style.display = 'none';
            document.getElementById('log-container').innerHTML = '<div class="text-slate-500 italic">> 重置完成，等待指令...</div>';
        }

        // 页面加载完成后初始化
        window.addEventListener('load', init);

    </script>
</body>
</html>
