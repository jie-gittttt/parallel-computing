<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卷积过程可视化 (Pthread 实验演示)</title>
    
    <!-- 1. 引入 Tailwind CSS 用于样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 引入 React 和 React DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- 3. 引入 Babel 用于在浏览器中编译 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* 防止页面加载时的闪烁 */
        body { opacity: 0; transition: opacity 0.5s; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        // 显式页面加载
        document.body.style.opacity = 1;

        const { useState, useEffect, useRef, useCallback } = React;

        // --- 图标组件 (替换 lucide-react) ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const Play = (props) => (
            <IconBase {...props}>
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </IconBase>
        );

        const Pause = (props) => (
            <IconBase {...props}>
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
            </IconBase>
        );

        const SkipForward = (props) => (
            <IconBase {...props}>
                <polygon points="5 4 15 12 5 20 5 4"></polygon>
                <line x1="19" y1="5" x2="19" y2="19"></line>
            </IconBase>
        );

        const RotateCcw = (props) => (
            <IconBase {...props}>
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
            </IconBase>
        );

        const Settings = (props) => (
            <IconBase {...props}>
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </IconBase>
        );

        const ArrowRight = (props) => (
            <IconBase {...props}>
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </IconBase>
        );

        // --- 常量定义 ---

        // 5x5 高斯核 (标准差 1.5)
        const GAUSSIAN_KERNEL_5x5 = [
            [0.003, 0.013, 0.022, 0.013, 0.003],
            [0.013, 0.059, 0.097, 0.059, 0.013],
            [0.022, 0.097, 0.159, 0.097, 0.022],
            [0.013, 0.059, 0.097, 0.059, 0.013],
            [0.003, 0.013, 0.022, 0.013, 0.003]
        ];

        const KERNEL_RADIUS = 2; // (5-1)/2
        const GRID_SIZE = 10; // 演示用的图像网格大小 10x10

        // 生成随机像素矩阵 (0-255)
        const generateRandomMatrix = (size) => {
            const matrix = [];
            for (let y = 0; y < size; y++) {
                const row = [];
                for (let x = 0; x < size; x++) {
                    // 噪点模式：大部分是暗色，偶尔有亮斑
                    const val = Math.random() > 0.85 ? 255 : Math.floor(Math.random() * 80); 
                    row.push(val);
                }
                matrix.push(row);
            }
            return matrix;
        };

        const App = () => {
            // --- 状态 ---
            const [inputMatrix, setInputMatrix] = useState(generateRandomMatrix(GRID_SIZE));
            const [outputMatrix, setOutputMatrix] = useState(Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(null)));
            
            // 当前处理的中心像素坐标
            const [currentX, setCurrentX] = useState(0);
            const [currentY, setCurrentY] = useState(0);
            
            const [isAnimating, setIsAnimating] = useState(false);
            const [speed, setSpeed] = useState(300); // ms
            const timerRef = useRef(null);

            // --- 核心卷积逻辑 ---
            const calculatePixel = useCallback((cx, cy, matrix) => {
                let sumR = 0;

                for (let ky = -KERNEL_RADIUS; ky <= KERNEL_RADIUS; ky++) {
                    for (let kx = -KERNEL_RADIUS; kx <= KERNEL_RADIUS; kx++) {
                        const nx = cx + kx;
                        const ny = cy + ky;
                        const weight = GAUSSIAN_KERNEL_5x5[ky + KERNEL_RADIUS][kx + KERNEL_RADIUS];

                        let pixelVal = 0;

                        // 边界检查 (Zero Padding)
                        if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE) {
                            pixelVal = matrix[ny][nx];
                        } else {
                            pixelVal = 0; // Padding
                        }

                        sumR += pixelVal * weight;
                    }
                }

                // 截断与取整
                const result = Math.min(Math.max(Math.round(sumR), 0), 255);
                return { result, rawSum: sumR };
            }, []);

            // --- 动画控制 ---
            const step = useCallback(() => {
                setOutputMatrix(prev => {
                    const next = prev.map(row => [...row]);
                    const { result } = calculatePixel(currentX, currentY, inputMatrix);
                    next[currentY][currentX] = result;
                    return next;
                });

                if (currentX < GRID_SIZE - 1) {
                    setCurrentX(currentX + 1);
                } else {
                    if (currentY < GRID_SIZE - 1) {
                        setCurrentX(0);
                        setCurrentY(currentY + 1);
                    } else {
                        setIsAnimating(false);
                    }
                }
            }, [currentX, currentY, inputMatrix, calculatePixel]);

            useEffect(() => {
                if (isAnimating) {
                    timerRef.current = setInterval(step, speed);
                } else {
                    clearInterval(timerRef.current);
                }
                return () => clearInterval(timerRef.current);
            }, [isAnimating, step, speed]);

            const handleReset = () => {
                setIsAnimating(false);
                setCurrentX(0);
                setCurrentY(0);
                setOutputMatrix(Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(null)));
                setInputMatrix(generateRandomMatrix(GRID_SIZE));
            };

            // --- UI 渲染辅助 ---
            const currentCalcDetails = calculatePixel(currentX, currentY, inputMatrix);

            const getCellColor = (val) => {
                if (val === null) return 'rgba(240, 240, 240, 1)'; // 未计算区域颜色
                return `rgb(${val}, ${val}, ${val})`;
            };

            // 单元格大小定义，用于计算绝对定位
            const CELL_SIZE = 40; // px (对应 w-10)
            const GAP_SIZE = 4;   // px (对应 gap-1)
            const TOTAL_CELL_SIZE = CELL_SIZE + GAP_SIZE;

            return (
                <div className="flex flex-col min-h-screen bg-slate-50 font-sans text-slate-800">
                
                {/* 顶部栏 */}
                <header className="bg-slate-900 text-white p-4 shadow-md z-20">
                    <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center">
                    <div>
                        <h1 className="text-xl font-bold flex items-center gap-2">
                        <Settings className="w-6 h-6 text-blue-400" />
                        卷积过程可视化 (Pthread 实验演示)
                        </h1>
                    </div>
                    
                    <div className="flex items-center gap-4 mt-4 md:mt-0">
                        <div className="flex items-center bg-slate-800 rounded-lg p-1">
                        <button 
                            onClick={() => setIsAnimating(!isAnimating)}
                            className={`px-4 py-2 rounded-md transition-colors flex items-center gap-2 font-medium ${isAnimating ? 'bg-red-500 hover:bg-red-600' : 'bg-green-500 hover:bg-green-600'}`}
                        >
                            {isAnimating ? <React.Fragment><Pause size={18} /> 暂停</React.Fragment> : <React.Fragment><Play size={18} /> 开始演示</React.Fragment>}
                        </button>
                        <button 
                            onClick={step}
                            disabled={isAnimating}
                            className="p-2 hover:bg-slate-700 rounded-md text-gray-300 disabled:opacity-50 ml-1"
                            title="单步执行"
                        >
                            <SkipForward size={18} />
                        </button>
                        <button 
                            onClick={handleReset}
                            className="p-2 hover:bg-slate-700 rounded-md text-gray-300 ml-1"
                            title="重置"
                        >
                            <RotateCcw size={18} />
                        </button>
                        </div>
                        
                        <div className="flex items-center gap-2 bg-slate-800 px-3 py-2 rounded-lg">
                        <span className="text-xs text-gray-400">速度</span>
                        <input 
                            type="range" 
                            min="10" 
                            max="800" 
                            step="50"
                            value={810 - speed} 
                            onChange={(e) => setSpeed(810 - Number(e.target.value))}
                            className="w-24 h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer"
                        />
                        </div>
                    </div>
                    </div>
                </header>

                {/* 主内容区 */}
                <main className="flex-1 max-w-7xl mx-auto w-full p-4 flex flex-col gap-6">
                    
                    {/* 上半部分：左右两个大图对比 */}
                    <div className="flex flex-col lg:flex-row justify-center items-start gap-8 lg:gap-16">
                    
                    {/* 左侧：输入矩阵 + 动态卷积核 */}
                    <div className="flex flex-col items-center">
                        <h2 className="text-lg font-bold mb-4 text-slate-700 flex items-center gap-2">
                        <span className="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">原始数据</span>
                        源图像 (Input)
                        </h2>
                        
                        <div className="relative p-6 bg-white rounded-xl shadow-lg border border-slate-200">
                        {/* 基础网格 */}
                        <div 
                            className="grid gap-1 relative z-0"
                            style={{ gridTemplateColumns: `repeat(${GRID_SIZE}, ${CELL_SIZE}px)` }}
                        >
                            {inputMatrix.map((row, y) => (
                            row.map((val, x) => (
                                <div 
                                key={`in-${x}-${y}`}
                                className="flex items-center justify-center text-[10px] select-none rounded-sm border border-slate-100"
                                style={{ 
                                    width: CELL_SIZE, 
                                    height: CELL_SIZE,
                                    backgroundColor: getCellColor(val),
                                    color: val > 128 ? '#000' : '#fff'
                                }}
                                >
                                {val}
                                </div>
                            ))
                            ))}
                        </div>

                        {/* 悬浮的卷积窗口层 (Overlay) - 实现"往外扩充"效果 */}
                        <div 
                            className="absolute top-6 left-6 pointer-events-none transition-transform duration-200 ease-out z-10"
                            style={{
                            transform: `translate(${(currentX - KERNEL_RADIUS) * TOTAL_CELL_SIZE}px, ${(currentY - KERNEL_RADIUS) * TOTAL_CELL_SIZE}px)`
                            }}
                        >
                            <div 
                            className="grid gap-1"
                            style={{ gridTemplateColumns: `repeat(5, ${CELL_SIZE}px)` }}
                            >
                            {Array.from({ length: 25 }).map((_, idx) => {
                                const kx = (idx % 5) - 2;
                                const ky = Math.floor(idx / 5) - 2;
                                const nx = currentX + kx;
                                const ny = currentY + ky;
                                const isOutOfBounds = nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE;

                                return (
                                <div 
                                    key={`kern-${idx}`}
                                    className={`
                                    flex items-center justify-center text-xs font-bold border-2 transition-all
                                    ${isOutOfBounds 
                                        ? 'bg-slate-800/80 text-white border-dashed border-slate-400 opacity-90' // 外部填充样式
                                        : 'border-blue-500 bg-blue-400/20 text-transparent' // 内部样式 (透明以显示底层像素)
                                    }
                                    ${kx === 0 && ky === 0 ? 'ring-2 ring-red-500 ring-offset-1 z-20' : ''} // 中心点标记
                                    `}
                                    style={{ width: CELL_SIZE, height: CELL_SIZE }}
                                >
                                    {isOutOfBounds && "0"}
                                </div>
                                );
                            })}
                            </div>
                            {/* 整体蓝色外框，增强显眼度 */}
                            <div className="absolute inset-0 border-4 border-blue-500 rounded-lg shadow-[0_0_15px_rgba(59,130,246,0.5)] -m-0.5"></div>
                            
                            {/* 提示标签 */}
                            <div className="absolute -top-8 left-0 w-full text-center">
                            <span className="bg-blue-600 text-white text-[10px] px-2 py-1 rounded shadow opacity-90 whitespace-nowrap">
                                5x5 卷积核
                            </span>
                            </div>
                        </div>

                        </div>
                        <div className="mt-2 text-xs text-slate-500 text-center max-w-[300px]">
                        当蓝色框移出图像边缘时，灰黑色方块代表补 0 (Padding)
                        </div>
                    </div>

                    {/* 指示箭头 */}
                    <div className="hidden lg:flex flex-col items-center justify-center pt-32 opacity-50">
                        <ArrowRight size={48} className="text-slate-400" />
                        <span className="text-xs font-mono text-slate-400 mt-2">CONVOLUTION</span>
                    </div>

                    {/* 右侧：结果图像 */}
                    <div className="flex flex-col items-center">
                        <h2 className="text-lg font-bold mb-4 text-slate-700 flex items-center gap-2">
                        <span className="bg-green-100 text-green-800 text-xs px-2 py-1 rounded">处理结果</span>
                        结果图像 (Output)
                        </h2>
                        
                        <div className="p-6 bg-white rounded-xl shadow-lg border border-slate-200 relative">
                        <div 
                            className="grid gap-1"
                            style={{ gridTemplateColumns: `repeat(${GRID_SIZE}, ${CELL_SIZE}px)` }}
                        >
                            {outputMatrix.map((row, y) => (
                            row.map((val, x) => {
                                const isCurrent = x === currentX && y === currentY;
                                return (
                                <div 
                                    key={`out-${x}-${y}`}
                                    className={`
                                    flex items-center justify-center text-[10px] select-none rounded-sm transition-all duration-300
                                    ${isCurrent ? 'ring-4 ring-green-500 z-10 scale-110 shadow-lg font-bold' : 'border border-slate-100'}
                                    `}
                                    style={{ 
                                    width: CELL_SIZE, 
                                    height: CELL_SIZE,
                                    backgroundColor: getCellColor(val),
                                    color: val !== null ? (val > 128 ? '#000' : '#fff') : '#999'
                                    }}
                                >
                                    {val !== null ? val : '.'}
                                </div>
                                );
                            })
                            ))}
                        </div>
                        </div>
                        <div className="mt-2 text-xs text-slate-500 text-center">
                        绿色高亮表示当前正在写入的像素
                        </div>
                    </div>

                    </div>

                    {/* 下半部分：详细信息面板 */}
                    <div className="mt-4 grid md:grid-cols-2 gap-6 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    
                    {/* 左下：权重展示 */}
                    <div>
                        <h3 className="text-sm font-bold text-slate-700 mb-3 border-b pb-2">5x5 高斯核权重 (Gaussian Kernel)</h3>
                        <div className="flex gap-4">
                        <div className="grid grid-cols-5 gap-1 bg-slate-50 p-2 rounded border border-slate-200">
                            {GAUSSIAN_KERNEL_5x5.map((row, ky) => (
                            row.map((w, kx) => (
                                <div key={`${kx}-${ky}`} className="w-8 h-8 flex items-center justify-center text-[9px] text-slate-600 bg-white rounded shadow-sm">
                                {w.toFixed(3).substring(1)}
                                </div>
                            ))
                            ))}
                        </div>
                        <div className="flex-1 text-xs text-slate-600 flex flex-col justify-center gap-2">
                            <p>● 权重中心高 (0.159)，四周低。</p>
                            <p>● 每个输出像素 = 输入窗口内 25 个像素与对应权重的<strong>加权和</strong>。</p>
                            <p>● <strong>Sum = Σ (Pixel × Weight)</strong></p>
                        </div>
                        </div>
                    </div>

                    {/* 右下：当前计算详情 */}
                    <div>
                        <h3 className="text-sm font-bold text-slate-700 mb-3 border-b pb-2">
                        当前计算详情 (Px: {currentX}, {currentY})
                        </h3>
                        <div className="flex items-center justify-between bg-slate-900 text-green-400 p-4 rounded-lg font-mono">
                        <div className="flex flex-col gap-1">
                            <span className="text-slate-400 text-xs">RAW SUM (浮点和)</span>
                            <span className="text-xl">{currentCalcDetails.rawSum.toFixed(4)}</span>
                        </div>
                        <ArrowRight className="text-slate-600" />
                        <div className="flex flex-col gap-1 text-right">
                            <span className="text-slate-400 text-xs">CLAMPED (取整/截断)</span>
                            <span className="text-3xl font-bold text-white">{currentCalcDetails.result}</span>
                        </div>
                        </div>
                        <div className="mt-3 text-xs text-slate-500">
                        * 若 sum &gt; 255 则截断为 255；若 sum &lt; 0 则截断为 0。
                        </div>
                    </div>

                    </div>
                </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
