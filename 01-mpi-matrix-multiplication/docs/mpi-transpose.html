<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPI 迷你矩陣運算可視化 (7x8 Scale - Transpose Optimized)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .cell-enter { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 h-screen overflow-hidden flex flex-col">

    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons ---
        const PlayIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
        const PauseIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>;
        const RotateCcwIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>;

        // --- Constants for Mini Scale ---
        const ROWS_A = 7;
        const COLS_A = 8; // N = 8
        const COLS_B = 7; // K = 7
        // Transposed B will be K * N => 7 * 8
        
        const RANKS = 4;
        
        // Row distribution: 7 rows / 4 ranks -> [2, 2, 2, 1]
        const rankRows = [2, 2, 2, 1]; 
        const rankStartRow = [0, 2, 4, 6];

        // --- Colors ---
        const rankColors = {
            0: 'bg-red-500',    1: 'bg-blue-500',
            2: 'bg-amber-500',  3: 'bg-purple-500'
        };
        const rankBorders = {
            0: 'border-red-500',   1: 'border-blue-500',
            2: 'border-amber-500', 3: 'border-purple-500'
        };
        const rankText = {
            0: 'text-red-400',   1: 'text-blue-400',
            2: 'text-amber-400', 3: 'text-purple-400'
        };

        // --- Mock Data Generator ---
        const generateMatrix = (rows, cols, offset) => {
            const m = [];
            for(let i=0; i<rows; i++) {
                const row = [];
                for(let j=0; j<cols; j++) row.push((i+1) + (j+1) + offset); 
                m.push(row);
            }
            return m;
        };

        const matrixA = generateMatrix(ROWS_A, COLS_A, 0);
        const matrixB = generateMatrix(COLS_A, COLS_B, 5); // Original B (8x7)
        
        // Generate Transposed B (7x8)
        // B[k][j] -> B_T[j][k]
        // Dimensions: COLS_B x COLS_A (7 x 8)
        const matrixB_T = [];
        for(let j=0; j<COLS_B; j++) {
            const row = [];
            for(let k=0; k<COLS_A; k++) {
                row.push(matrixB[k][j]);
            }
            matrixB_T.push(row);
        }

        // --- Components ---

        const MatrixCell = ({ val, isActive, isHighlight, colorClass }) => (
            <div className={`flex items-center justify-center text-[10px] font-mono border border-slate-700 transition-all duration-200
                ${isActive ? 'bg-white text-slate-900 font-bold scale-110 z-10 shadow-lg' : ''}
                ${isHighlight ? colorClass + ' text-white' : 'text-slate-500'}
            `}>
                {val}
            </div>
        );

        const MainApp = () => {
            // State
            const [activeRank, setActiveRank] = useState(0);
            const [i, setI] = useState(0); // Global row index
            const [j, setJ] = useState(0); // Col index (now row index in B_T)
            const [k, setK] = useState(0); // Inner loop index
            const [currentSum, setCurrentSum] = useState(0);
            const [computedD, setComputedD] = useState(Array(ROWS_A).fill().map(() => Array(COLS_B).fill(null)));
            
            const [isAnimating, setIsAnimating] = useState(false);
            const [speed, setSpeed] = useState(200); // ms per step

            // Helper to map global row 'i' to local logic
            const getRankForRow = (rowIdx) => {
                if (rowIdx < 2) return 0;
                if (rowIdx < 4) return 1;
                if (rowIdx < 6) return 2;
                return 3;
            };

            // Animation Logic
            useEffect(() => {
                let timer;
                if (isAnimating) {
                    timer = setTimeout(() => {
                        let nextK = k + 1;
                        let nextJ = j;
                        let nextI = i;
                        
                        // Calculate current step value
                        const valA = matrixA[i][k];
                        // OPTIMIZED ACCESS: B_T[j][k] instead of B[k][j]
                        const valB = matrixB_T[j][k]; 
                        const prod = valA * valB;
                        const newSum = (k === 0 ? 0 : currentSum) + prod;
                        setCurrentSum(newSum);

                        if (nextK >= COLS_A) { // k < N (8)
                            // Inner loop finished, store result D[i][j]
                            const newD = [...computedD];
                            newD[i] = [...newD[i]];
                            newD[i][j] = newSum; 
                            setComputedD(newD);

                            nextK = 0;
                            setCurrentSum(0); 
                            nextJ++;
                            if (nextJ >= COLS_B) { // j < K (7)
                                nextJ = 0;
                                nextI++;
                                if (nextI >= ROWS_A) {
                                    setIsAnimating(false); 
                                    return;
                                }
                                setActiveRank(getRankForRow(nextI));
                            }
                        }
                        
                        setK(nextK);
                        setJ(nextJ);
                        setI(nextI);

                    }, speed);
                }
                return () => clearTimeout(timer);
            }, [isAnimating, k, j, i, speed, currentSum, computedD]);

            const reset = () => {
                setIsAnimating(false);
                setI(0); setJ(0); setK(0);
                setCurrentSum(0);
                setActiveRank(0);
                setComputedD(Array(ROWS_A).fill().map(() => Array(COLS_B).fill(null)));
            };

            return (
                <div className="flex flex-col h-full w-full max-w-6xl mx-auto p-4">
                    
                    {/* Header */}
                    <header className="flex justify-between items-center mb-6 bg-slate-900 p-4 rounded-xl border border-slate-800">
                        <div>
                            <h1 className="text-lg font-bold text-white flex items-center gap-2">
                                <span className="text-emerald-400">MPI</span> 迷你矩陣演示 (轉置優化版)
                            </h1>
                            <div className="text-xs text-slate-400 font-mono mt-1 flex gap-4">
                                <span>Rank: <span className={rankText[activeRank]}>{activeRank}</span></span>
                                <span>Row(i): {i}</span>
                                <span>Col(j): {j}</span>
                                <span>Scan(k): {k}</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="flex items-center gap-2 text-xs text-slate-400">
                                <span>速度:</span>
                                <input type="range" min="50" max="1000" step="50" value={1050-speed} onChange={(e) => setSpeed(1050-Number(e.target.value))} className="w-24 accent-emerald-500"/>
                            </div>
                            <button onClick={() => setIsAnimating(!isAnimating)} className="p-2 bg-emerald-600 rounded-full hover:bg-emerald-500 text-white transition-colors">
                                {isAnimating ? <PauseIcon /> : <PlayIcon />}
                            </button>
                            <button onClick={reset} className="p-2 bg-slate-700 rounded-full hover:bg-slate-600 text-white transition-colors">
                                <RotateCcwIcon />
                            </button>
                        </div>
                    </header>

                    {/* Main Canvas */}
                    <div className="flex-1 flex items-center justify-center gap-2 md:gap-8 relative">
                        
                        {/* Matrix A */}
                        <div className="flex flex-col gap-1">
                            <div className="text-center text-xs text-slate-400 mb-1">Matrix A (7x8)</div>
                            <div className="grid grid-rows-7 gap-[1px] bg-slate-800 p-1 rounded border border-slate-700">
                                {matrixA.map((row, rIdx) => (
                                    <div key={rIdx} className="grid grid-cols-8 gap-[1px]">
                                        {row.map((val, cIdx) => {
                                            const isMyRow = rIdx === i;
                                            const isMyK = isMyRow && cIdx === k;
                                            const myRank = getRankForRow(rIdx);
                                            return (
                                                <div key={cIdx} className={`w-8 h-8 flex items-center justify-center text-[10px] font-mono transition-all
                                                    ${isMyK ? 'bg-white text-black font-bold scale-110 z-10 shadow shadow-white/50' : ''}
                                                    ${!isMyK && isMyRow ? rankColors[myRank] + ' text-white opacity-80' : ''}
                                                    ${!isMyRow ? 'bg-slate-800 text-slate-600' : ''}
                                                `}>
                                                    {val}
                                                </div>
                                            );
                                        })}
                                    </div>
                                ))}
                            </div>
                            {/* Partition Lines (Visual Only) */}
                            <div className="absolute -left-4 top-1/2 -translate-y-1/2 h-[260px] w-2 flex flex-col justify-between py-2">
                                {[0,1,2,3].map(r => (
                                    <div key={r} className={`w-1 h-full rounded-full ${rankColors[r]} opacity-50`}></div>
                                ))}
                            </div>
                        </div>

                        <div className="text-xl font-bold text-slate-600">×</div>

                        {/* Matrix B_T (Transposed) */}
                        <div className="flex flex-col gap-1">
                            <div className="text-center text-xs text-emerald-400 mb-1 font-bold">Matrix B_T (7x8)</div>
                            <div className="grid grid-rows-7 gap-[1px] bg-slate-800 p-1 rounded border border-emerald-500/50 shadow-[0_0_15px_rgba(16,185,129,0.1)]">
                                {matrixB_T.map((row, rIdx) => (
                                    <div key={rIdx} className="grid grid-cols-8 gap-[1px]">
                                        {row.map((val, cIdx) => {
                                            // rIdx now corresponds to 'j' (original Col index)
                                            // cIdx now corresponds to 'k' (inner loop index)
                                            const isMyRow = rIdx === j; // Scanning row j of B_T
                                            const isMyK = isMyRow && cIdx === k;
                                            return (
                                                <div key={cIdx} className={`w-8 h-8 flex items-center justify-center text-[10px] font-mono transition-all
                                                    ${isMyK ? 'bg-white text-black font-bold scale-110 z-10 shadow shadow-white/50' : ''}
                                                    ${!isMyK && isMyRow ? 'bg-emerald-600 text-white opacity-80' : ''}
                                                    ${!isMyRow ? 'bg-slate-800 text-slate-600' : ''}
                                                `}>
                                                    {val}
                                                </div>
                                            );
                                        })}
                                    </div>
                                ))}
                            </div>
                            <div className="text-[10px] text-center text-emerald-400 mt-1 font-bold animate-pulse">
                                B_T[j][k] 掃描方向 &rarr; (連續!)
                            </div>
                        </div>

                        <div className="text-xl font-bold text-slate-600">=</div>

                        {/* Matrix D (Result) */}
                        <div className="flex flex-col gap-1">
                            <div className="text-center text-xs text-slate-400 mb-1">Matrix D (7x7)</div>
                            <div className="grid grid-rows-7 gap-[1px] bg-slate-800 p-1 rounded border border-slate-700">
                                {computedD.map((row, rIdx) => (
                                    <div key={rIdx} className="grid grid-cols-7 gap-[1px]">
                                        {row.map((val, cIdx) => {
                                            const isCurrentTarget = rIdx === i && cIdx === j;
                                            const myRank = getRankForRow(rIdx);
                                            return (
                                                <div key={cIdx} className={`w-8 h-8 flex items-center justify-center text-[10px] font-mono transition-all border border-transparent
                                                    ${isCurrentTarget ? 'border-white animate-pulse' : ''}
                                                    ${val !== null ? rankColors[myRank] + ' text-white' : 'bg-slate-900 text-slate-700'}
                                                `}>
                                                    {val !== null ? val : '.'}
                                                </div>
                                            );
                                        })}
                                    </div>
                                ))}
                            </div>
                        </div>

                    </div>

                    {/* Calculation Details Footer */}
                    <div className="mt-8 bg-slate-900 p-4 rounded-lg border border-slate-800 flex items-center justify-center gap-8">
                        <div className="text-xs text-slate-400 font-mono">
                            正在計算: <span className="text-white">Rank {activeRank}</span>
                        </div>
                        
                        <div className="flex items-center gap-4 font-mono text-sm bg-slate-950 px-6 py-3 rounded border border-slate-700">
                            <div className="flex flex-col items-center">
                                <span className="text-[10px] text-red-400">A[{i}][{k}]</span>
                                <span className="text-lg font-bold">{matrixA[i][k]}</span>
                            </div>
                            <div className="text-slate-500">×</div>
                            <div className="flex flex-col items-center">
                                <span className="text-[10px] text-emerald-400">B_T[{j}][{k}]</span>
                                <span className="text-lg font-bold">{matrixB_T[j][k]}</span>
                            </div>
                            <div className="text-slate-500">+</div>
                            <div className="flex flex-col items-center opacity-50">
                                <span className="text-[10px] text-slate-500">prev_sum</span>
                                <span className="text-sm">{k===0 ? 0 : (currentSum - matrixA[i][k]*matrixB_T[j][k])}</span>
                            </div>
                            <div className="text-slate-500">=</div>
                            <div className="flex flex-col items-center">
                                <span className="text-[10px] text-emerald-400">current_sum</span>
                                <span className="text-xl font-bold text-emerald-400">{currentSum}</span>
                            </div>
                        </div>

                        <div className="text-xs text-slate-500 w-32">
                            * B 已轉置，k 循環現在是連續內存訪問 (Sequential Access)。
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>
</html>
